<!-- Designer Henk: Exemplo de estrutura para exibir informações do jogador -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Draft Valorant</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/exemplo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">

</head>

<body>
    <div>
        <h2>Exemplo de Jogador</h2>
        <span class="jog-name">Jogador</span>
        <select class="select-roles">
            <option value="" disabled selected>Escolha a função...</option>
        </select>
        <span class="jog-overall">- Overall: 67</span>
        <button class="btn-remake">Selecionar</button>
    </div>

    <div>
        <span class="jog-name">Jogador</span>
        <span class="jog-roles">(duelista)</span>
        <span class="jog-overall">- Overall: 67</span>
        <button class="btn-remake">Selecionar</button>
    </div>

    <div class="left">
        <div class="time">
            <div>
                <div class="time-info">
                    <img class="time-img" src="assets/images/logos_times/loud.png">
                    <span class="time-name">LOUD</span>
                </div>
                <span class="time-year">Champions 2022</span>
            </div>
            <span class="time-podium">1</span>
        </div>
        <div class="jogadores-lista">
            <div class="jog-item">
                <span class="jog-name">Jogador</span>
                <div class="jog-info">
                    <div class="jog-roles-container">
                        <span class="jog-roles"><img src="assets/images/roles/duelista.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/controlador.svg" class="img-role"></span>
                        <span class=" jog-roles"><img src="assets/images/roles/sentinela.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/iniciador.svg" class="img-role"></span>
                    </div>
                    <span class="jog-overall">67</span>
                </div>
            </div>
            <div class="jog-item">
                <span class="jog-name">Jogador</span>
                <div class="jog-info">
                    <div class="jog-roles-container">
                        <span class="jog-roles"><img src="assets/images/roles/duelista.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/controlador.svg" class="img-role"></span>
                        <span class=" jog-roles"><img src="assets/images/roles/sentinela.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/iniciador.svg" class="img-role"></span>
                    </div>
                    <span class="jog-overall">67</span>
                </div>
            </div>
            <div class="jog-item-disabled">
                <span class="jog-name">Jogador</span>
                <div class="jog-info">
                    <div class="jog-roles-container">
                        <span class="jog-roles"><img src="assets/images/roles/duelista.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/controlador.svg" class="img-role"></span>
                        <span class=" jog-roles"><img src="assets/images/roles/sentinela.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/iniciador.svg" class="img-role"></span>
                    </div>
                    <span class="jog-overall">67</span>
                </div>
            </div>
            <div class="jog-item">
                <span class="jog-name">Jogador</span>
                <div class="jog-info">
                    <div class="jog-roles-container">
                        <span class="jog-roles"><img src="assets/images/roles/duelista.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/controlador.svg" class="img-role"></span>
                        <span class=" jog-roles"><img src="assets/images/roles/sentinela.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/iniciador.svg" class="img-role"></span>
                    </div>
                    <span class="jog-overall">67</span>
                </div>
            </div>
            <div class="jog-item-disabled">
                <span class="jog-name">Jogador</span>
                <div class="jog-info">
                    <div class="jog-roles-container">
                        <span class="jog-roles"><img src="assets/images/roles/duelista.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/controlador.svg" class="img-role"></span>
                        <span class=" jog-roles"><img src="assets/images/roles/sentinela.svg" class="img-role"></span>
                        <span class="jog-roles"><img src="assets/images/roles/iniciador.svg" class="img-role"></span>
                    </div>
                    <span class="jog-overall">67</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#211820">
    <title>MVP | Draft</title>
    <link rel="icon" href="assets/images/mvp.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/teamhighlight.css">
    <link rel="stylesheet" href="assets/css/draft.css">
</head>

<body>

    <header class="draft-navbar">
        <div class="nav-container">
            <!-- Logo MVP -->
            <a class="logo-link" href="index.html" aria-label="MVP, início">
                <img src="assets/images/mvp.svg" class="logo-img">
                <span>MVP</span>
            </a>

            <nav class="nav-menu">
                <a href="index.html" class="nav-link active" style="margin-right: 2rem;">Início</a>
            </nav>
        </div>
    </header>
    
    <div class="main-content">
        <main class="draft-main">
            <section aria-label="Seção de draft da esquerda" class="draft-section-left">
                <div id="team-highlight" class="team-highlight"
                    style="--team-color-start: #7d1616; --team-color-end: #d81111;">
                    <div class="team-info-group">
                        <div id="team-logo-wrap" class="team-logo-wrap">
                            <img id="team-logo" class="team-logo-img hidden" alt="">
                            <span id="team-monogram" class="team-monogram">MVP</span>
                        </div>
                        <div class="team-text-wrap">
                            <h1 id="team-name" class="team-name">Carregando time...</h1>
                            <p id="team-championship" class="team-championship"></p>
                        </div>
                    </div>
                    <p id="team-ranking" class="team-ranking">—</p>
                </div>

                <div class="reroll-panel">
                    <button id="btn-outro-time" type="button" onclick="rerollOutroTime()" class="btn-secondary">Outro
                        Time</button>
                    <button id="btn-outro-ano" type="button" onclick="rerollMesmoTimeOutroAno()"
                        class="btn-secondary">Outro Ano</button>
                </div>

                <div class="players-container">
                    <div class="players-container-header">
                        <span>Jogadores disponíveis</span>
                        <span>Overall</span>
                    </div>
                    <div id="players-wrapper" class="players-wrapper" aria-live="polite">
                        <p>Conectando ao draft...</p>
                    </div>
                </div>
            </section>

            <div class="draft-divider" aria-hidden="true"></div>

            <section aria-label="Seleção de função e roster" class="draft-section-right">
                <div id="role-picker" class="role-picker" aria-live="polite">
                    <div>
                        <h2 id="role-picker-title" class="role-picker-title">Escolha a função de um jogador</h2>
                        <p id="role-picker-hint" class="role-picker-hint">Selecione um atleta na lista</p>
                    </div>
                    <div id="role-picker-options" class="role-picker-options" role="group"
                        aria-label="Funções disponíveis">
                        <span></span>
                    </div>
                </div>
                <div class="roster-stats-bar">
                    <span><strong id="stat-atk" class="stat-atk">—</strong> Ataque</span>
                    <span><strong id="stat-def" class="stat-def">—</strong> Defesa</span>
                    <span><strong id="stat-geral" class="stat-geral">—</strong> Geral</span>
                    <span class="roster-label">SUA EQUIPE</span>
                </div>
                <div id="roster-list" class="roster-list" aria-live="polite">
                    <p class="roster-empty-message">Escolha jogadores para montar a sua equipe.</p>
                </div>
                <p id="roster-summary" class="roster-summary"></p>
            </section>
        </main>
    </div>

    <script src="assets/js/draft.js"></script>
</body>

</html>
